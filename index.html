<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>户型分析</title>
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #eef1f6; color: #333;
    touch-action: none; /* 防止移动端页面滚动 */
  }
  header {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 16px; background: #fff; border-bottom: 1px solid #e3e6eb;
    box-shadow: 0 1px 3px rgba(0,0,0,.04); z-index: 10;
  }
  header h1 {
    font-size: 16px; margin: 0 14px 0 0; font-weight: 700;
    letter-spacing: 2px; color: #1f2a44;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    padding: 7px 14px; border-radius: 6px; border: 1px solid #d5dae2;
    background: #fff; color: #333; cursor: pointer; font-size: 13px;
    transition: .15s; user-select: none; line-height: 1.4;
  }
  .btn:hover { border-color: #2f80ed; color: #2f80ed; background: #f7faff; }
  .btn.primary { background: #2f80ed; border-color: #2f80ed; color: #fff; }
  .btn.primary:hover { background: #1c6fdc; color: #fff; }
  .btn input[type=file] { display: none; }
  .divider { width: 1px; height: 22px; background: #e3e6eb; margin: 0 4px; }
  .spacer { flex: 1; }

  .color-field {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 3px 10px 3px 12px; border: 1px solid #d5dae2;
    border-radius: 6px; background: #fff; font-size: 13px; color: #556;
  }
  .color-field input[type=color] {
    width: 30px; height: 24px; border: none; background: none; padding: 0;
    cursor: pointer;
  }

  main { flex: 1; display: flex; min-height: 0; }
  .stage { flex: 1; position: relative; overflow: hidden; touch-action: none; }
  .stage canvas { touch-action: none; }

  /* 方向坐标图 - 右下角 */
  .compass {
    position: absolute; right: 24px; bottom: 24px;
    width: 96px; height: 96px;
    pointer-events: none;
    z-index: 5;
  }

  /* ===== 右侧图层面板 ===== */
  aside {
    width: 210px; background: #fff; border-left: 1px solid #e3e6eb;
    display: flex; flex-direction: column; min-height: 0;
    transition: width 0.25s ease;
    position: relative;
  }
  aside.collapsed { width: 0; border-left: none; }
  aside.collapsed .aside-header h2,
  aside.collapsed #layers { display: none; }

  .aside-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px 8px;
  }
  .aside-header h2 {
    font-size: 12px; color: #8a94a6; margin: 0;
    font-weight: 600; letter-spacing: .5px;
  }
  .toggle-layer-btn {
    background: #fff; border: 1px solid #d5dae2; border-radius: 4px;
    cursor: pointer; color: #6b7a90; font-size: 12px;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    transition: 0.2s; padding: 0;
  }
  .toggle-layer-btn:hover { border-color: #2f80ed; color: #2f80ed; }
  aside.collapsed .toggle-layer-btn {
    position: absolute; left: -28px; top: 10px;
    border-right: none; border-radius: 6px 0 0 6px;
    width: 28px; height: 32px; z-index: 10;
    box-shadow: -2px 0 5px rgba(0,0,0,0.05);
  }

  #layers { flex: 1; overflow: auto; padding: 0 8px 8px; }
  .layer {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
    margin-bottom: 4px; border: 1px solid transparent;
  }
  .layer:hover { background: #f5f7fa; }
  .layer.active { background: #eaf2fe; border-color: #b9d4fb; color: #1c6fdc; }
  .layer .icon { font-size: 12px; color: #9aa4b2; }
  .layer.active .icon { color: #1c6fdc; }
  .layer .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer .del { color: #b0b8c4; font-size: 16px; line-height: 1; padding: 0 2px; }
  .layer .del:hover { color: #e5484d; }
  .empty { color: #aeb6c2; font-size: 12px; padding: 6px; }

  .hint {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    color: #b6bec9; font-size: 14px; pointer-events: none; text-align: center;
    line-height: 2;
  }

  /* 移动端适配 */
  @media (max-width: 640px) {
    .compass { width: 78px; height: 78px; right: 16px; bottom: 16px; }
    header h1 { font-size: 14px; letter-spacing: 1px; }
    .btn { padding: 6px 10px; font-size: 12px; }
    aside { width: 160px; }
  }
</style>
</head>
<body>

<header>
  <h1>户型分析</h1>

  <label class="btn">
    ＋ 上传户型图
    <input type="file" id="fileA" accept="image/*" multiple>
  </label>

  <span class="divider"></span>

  <button class="btn" id="btnJiugong">＋ 九宫网格</button>
  <button class="btn" id="btnErshisi">＋ 二十四山</button>

  <span class="divider"></span>

  <label class="color-field">
    文字颜色
    <input type="color" id="colorPicker" value="#1a7f7a">
  </label>

  <button class="btn" id="btnDelete">删除选中</button>
  <button class="btn" id="btnClear">清空</button>

  <span class="spacer"></span>
  <button class="btn primary" id="btnExport">保存分析图</button>
</header>

<main>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>

    <!-- 方向坐标图 -->
    <div class="compass" title="方向指示（东、南、西、北）">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <defs>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/>
          </filter>
        </defs>
        <circle cx="50" cy="50" r="46" fill="rgba(255,255,255,0.92)"
                stroke="#d5dae2" stroke-width="1.5" filter="url(#shadow)"/>
        <path d="M50,50 L50,80 M20,50 L80,50"
              stroke="#eef1f6" stroke-width="1.5" stroke-linecap="round"/>
        <text x="50" y="20" text-anchor="middle" dominant-baseline="middle"
              font-size="14" fill="#e5484d" font-weight="bold"
              font-family='"PingFang SC","Microsoft YaHei",sans-serif'>北</text>
        <polygon points="50,32 44,44 56,44" fill="#e5484d"/>
        <text x="50" y="86" text-anchor="middle" dominant-baseline="middle"
              font-size="13" fill="#6b7280"
              font-family='"PingFang SC","Microsoft YaHei",sans-serif'>南</text>
        <text x="86" y="50" text-anchor="middle" dominant-baseline="middle"
              font-size="13" fill="#6b7280"
              font-family='"PingFang SC","Microsoft YaHei",sans-serif'>东</text>
        <text x="14" y="50" text-anchor="middle" dominant-baseline="middle"
              font-size="13" fill="#6b7280"
              font-family='"PingFang SC","Microsoft YaHei",sans-serif'>西</text>
      </svg>
    </div>

    <div class="hint" id="hint">
      请先上传户型图，或添加内置图层
    </div>
  </div>

  <aside id="layerPanel">
    <div class="aside-header">
      <h2>图层</h2>
      <button class="toggle-layer-btn" id="toggleLayerBtn" title="折叠图层面板">◀</button>
    </div>
    <div id="layers"></div>
  </aside>
</main>

<script>
/* =====================================================
   1. 初始化画布
   ===================================================== */
const stageEl  = document.getElementById('stage');
const hintEl   = document.getElementById('hint');
const layersEl = document.getElementById('layers');

const canvas = new fabric.Canvas('c', {
  backgroundColor: '#ffffff',
  preserveObjectStacking: true,
  uniScaleTransform: true,
  selection: false,
});

fabric.Object.prototype.set({
  borderColor: '#2f80ed',
  borderScaleFactor: 1.5,
  cornerColor: '#2f80ed',
  cornerStrokeColor: '#ffffff',
  cornerStyle: 'circle',
  cornerSize: 14,       // 移动端稍大一些的触摸手柄
  padding: 4,
  transparentCorners: false,
});

function resizeStage() {
  canvas.setDimensions({
    width:  stageEl.clientWidth  || 800,
    height: stageEl.clientHeight || 600,
  });
  canvas.requestRenderAll();
}
window.addEventListener('resize', resizeStage);
resizeStage();

/* =====================================================
   2. 图层面板折叠
   ===================================================== */
const layerPanel = document.getElementById('layerPanel');
const toggleLayerBtn = document.getElementById('toggleLayerBtn');

toggleLayerBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const isCollapsed = layerPanel.classList.toggle('collapsed');
  toggleLayerBtn.textContent = isCollapsed ? '▶' : '◀';
  toggleLayerBtn.title = isCollapsed ? '展开图层面板' : '折叠图层面板';
  setTimeout(resizeStage, 260);
});

/* =====================================================
   3. ★★★ 双指手势操作（手机触摸屏核心功能）★★★
   =====================================================
   功能：
   - 单指触摸：由 fabric 处理，可拖动、点击选中图层
   - 双指触摸：捏合缩放 / 旋转 / 平移当前选中的图层
   ===================================================== */

let touchGesture = null;

/** 提取两指之间的距离、角度、中心点 */
function getTouchInfo(touches) {
  const t1 = touches[0];
  const t2 = touches[1];
  const dx = t2.clientX - t1.clientX;
  const dy = t2.clientY - t1.clientY;
  return {
    dist: Math.hypot(dx, dy),
    angle: Math.atan2(dy, dx) * 180 / Math.PI,
    center: {
      x: (t1.clientX + t2.clientX) / 2,
      y: (t1.clientY + t2.clientY) / 2,
    },
  };
}

/** 双指手势开始 —— 在 stageEl 的捕获阶段拦截，阻止 fabric 处理 */
function onGestureStart(e) {
  if (e.touches.length !== 2) return;

  const activeObj = canvas.getActiveObject();
  if (!activeObj) return;   // 无选中图层时不接管手势

  // 阻止事件传播到 fabric.js 的画布
  e.stopPropagation();
  e.preventDefault();

  const info = getTouchInfo(e.touches);

  touchGesture = {
    // 手势基准数据
    startDist:   info.dist,
    startAngle:  info.angle,
    startCenter: { x: info.center.x, y: info.center.y },
    // 图层初始状态
    obj:         activeObj,
    objScaleX:   activeObj.scaleX,
    objScaleY:   activeObj.scaleY,
    objAngle:    activeObj.angle,
    objLeft:     activeObj.left,
    objTop:      activeObj.top,
  };
}

/** 双指手势移动 —— 同时处理缩放、旋转、平移 */
function onGestureMove(e) {
  if (!touchGesture || e.touches.length !== 2) return;

  e.stopPropagation();
  e.preventDefault();

  const info = getTouchInfo(e.touches);
  const obj = touchGesture.obj;

  // 缩放系数（当前两指距离 / 起始两指距离）
  const scaleFactor = info.dist / touchGesture.startDist;
  // 旋转角度差
  const angleDiff = info.angle - touchGesture.startAngle;
  // 平移偏移（中心点位移）
  const dx = info.center.x - touchGesture.startCenter.x;
  const dy = info.center.y - touchGesture.startCenter.y;

  // 应用变换
  obj.scaleX = touchGesture.objScaleX * scaleFactor;
  obj.scaleY = touchGesture.objScaleY * scaleFactor;
  obj.angle  = touchGesture.objAngle + angleDiff;
  obj.left   = touchGesture.objLeft + dx;
  obj.top    = touchGesture.objTop + dy;

  // 防止缩放为 0 或负数导致消失
  if (Math.abs(obj.scaleX) < 0.01) obj.scaleX = 0.01;
  if (Math.abs(obj.scaleY) < 0.01) obj.scaleY = 0.01;

  obj.setCoords();
  canvas.requestRenderAll();
}

/** 双指手势结束 —— 少于两个触摸点时清除手势状态 */
function onGestureEnd(e) {
  if (!touchGesture) return;
  if (e.touches.length < 2) {
    touchGesture = null;
  }
}

// 关键：使用捕获阶段（capture: true），在 fabric 之前拦截事件
stageEl.addEventListener('touchstart',  onGestureStart, { capture: true, passive: false });
stageEl.addEventListener('touchmove',   onGestureMove,  { capture: true, passive: false });
stageEl.addEventListener('touchend',    onGestureEnd,   { capture: true, passive: false });
stageEl.addEventListener('touchcancel', onGestureEnd,   { capture: true, passive: false });

// 阻止移动端画布区域默认的浏览器手势（如页面缩放）
stageEl.addEventListener('gesturestart', (e) => e.preventDefault());

/* =====================================================
   4. 内置图层（矢量绘制）
   ===================================================== */
const PRESETS = {
  jiugong: {
    name: '九宫网格',
    cols: 3,
    labels: [
      ['巽', '离', '坤'],
      ['震', '',  '兑'],
      ['艮', '坎', '乾'],
    ],
  },
  ershisi: {
    name: '二十四山',
    cols: 7,
    labels: [
      ['巽', '巳', '丙', '午', '丁', '未', '坤'],
      ['辰', '',  '',  '',  '',  '',  '申'],
      ['乙', '',  '',  '',  '',  '',  '庚'],
      ['卯', '',  '',  '',  '',  '',  '酉'],
      ['甲', '',  '',  '',  '',  '',  '辛'],
      ['寅', '',  '',  '',  '',  '',  '戌'],
      ['艮', '丑', '癸', '子', '壬', '亥', '乾'],
    ],
  },
};

let currentColor = '#1a7f7a';

function createPresetGroup(key, color) {
  const p    = PRESETS[key];
  const cols = p.cols;
  const size = Math.min(canvas.getWidth(), canvas.getHeight()) * 0.8;
  const cell = size / cols;
  const lineW = Math.max(1.4, cell * 0.022);
  const items = [];

  for (let i = 0; i <= cols; i++) {
    items.push(new fabric.Line([i * cell, 0, i * cell, size], {
      stroke: color, strokeWidth: lineW,
    }));
    items.push(new fabric.Line([0, i * cell, size, i * cell], {
      stroke: color, strokeWidth: lineW,
    }));
  }

  p.labels.forEach((row, r) => {
    row.forEach((ch, c) => {
      if (!ch) return;
      items.push(new fabric.Text(ch, {
        left: c * cell + cell / 2,
        top:  r * cell + cell / 2,
        originX: 'center',
        originY: 'center',
        fontSize: cell * 0.66,
        fontFamily: '"KaiTi","STKaiti","Kaiti SC","楷体","Songti SC",serif',
        fontWeight: 'bold',
        fill: color,
      }));
    });
  });

  const g = new fabric.Group(items, {
    left: canvas.getWidth() / 2,
    top:  canvas.getHeight() / 2,
    originX: 'center',
    originY: 'center',
    objectCaching: false,
    subTargetCheck: false,
  });

  g.layerName = p.name;
  g.isPreset  = true;
  g.presetKey = key;

  return g;
}

function applyPresetColor(group, color) {
  group.getObjects().forEach((o) => {
    if (o.type === 'text')      o.set('fill', color);
    else if (o.type === 'line') o.set('stroke', color);
    o.dirty = true;
  });
  group.dirty = true;
  canvas.requestRenderAll();
}

function addPresetLayer(key) {
  const g = createPresetGroup(key, currentColor);
  canvas.add(g);
  canvas.bringToFront(g);
  canvas.setActiveObject(g);
  canvas.requestRenderAll();
  refreshLayers();
  updateHint();
}

document.getElementById('btnJiugong').onclick  = () => addPresetLayer('jiugong');
document.getElementById('btnErshisi').onclick  = () => addPresetLayer('ershisi');

/* =====================================================
   5. 工具函数
   ===================================================== */
function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload  = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

function updateHint() {
  hintEl.style.display = canvas.getObjects().length ? 'none' : 'block';
}

/* =====================================================
   6. 上传户型图（始终置于最底层）
   ===================================================== */
async function addImageLayer(file) {
  if (!file || !file.type.startsWith('image/')) return;

  const dataURL = await readAsDataURL(file);

  return new Promise((resolve) => {
    fabric.Image.fromURL(dataURL, (img) => {
      const cw = canvas.getWidth();
      const ch = canvas.getHeight();

      const scale = Math.min((cw * 0.8) / img.width, (ch * 0.8) / img.height, 1);
      img.set({
        left: cw / 2,
        top:  ch / 2,
        originX: 'center',
        originY: 'center',
        scaleX: scale,
        scaleY: scale,
      });

      img.layerName = file.name || '户型图';
      img.isPreset  = false;

      canvas.add(img);
      canvas.sendToBack(img);
      canvas.setActiveObject(img);
      canvas.requestRenderAll();

      refreshLayers();
      updateHint();
      resolve();
    });
  });
}

document.getElementById('fileA').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  for (const f of files) {
    await addImageLayer(f);
  }
  e.target.value = '';
});

/* =====================================================
   7. 颜色调节
   ===================================================== */
const colorPicker = document.getElementById('colorPicker');

colorPicker.addEventListener('input', (e) => {
  currentColor = e.target.value;

  const actives = canvas.getActiveObjects().filter((o) => o.isPreset);
  const targets = actives.length
    ? actives
    : canvas.getObjects().filter((o) => o.isPreset);

  targets.forEach((g) => applyPresetColor(g, currentColor));
});

/* =====================================================
   8. 图层面板列表
   ===================================================== */
function refreshLayers() {
  const objs    = canvas.getObjects().slice().reverse();
  const actives = canvas.getActiveObjects();

  layersEl.innerHTML = '';

  if (!objs.length) {
    layersEl.innerHTML = '<div class="empty">暂无图层</div>';
    return;
  }

  objs.forEach((o) => {
    const row = document.createElement('div');
    row.className = 'layer' + (actives.includes(o) ? ' active' : '');

    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = o.isPreset ? '▦' : '▢';
    row.appendChild(icon);

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = o.layerName || '图层';
    name.title = o.layerName || '图层';
    row.appendChild(name);

    const del = document.createElement('span');
    del.className = 'del';
    del.textContent = '×';
    del.title = '删除该图层';
    del.onclick = (ev) => {
      ev.stopPropagation();
      canvas.remove(o);
      canvas.discardActiveObject();
      canvas.requestRenderAll();
      refreshLayers();
      updateHint();
    };
    row.appendChild(del);

    row.onclick = () => {
      canvas.setActiveObject(o);
      canvas.requestRenderAll();
      refreshLayers();
    };

    layersEl.appendChild(row);
  });
}

canvas.on('selection:created', refreshLayers);
canvas.on('selection:updated', refreshLayers);
canvas.on('selection:cleared', refreshLayers);

/* =====================================================
   9. 删除 / 清空
   ===================================================== */
function deleteSelected() {
  const objs = canvas.getActiveObjects();
  if (!objs.length) return;
  objs.forEach((o) => canvas.remove(o));
  canvas.discardActiveObject();
  canvas.requestRenderAll();
  refreshLayers();
  updateHint();
}

document.getElementById('btnDelete').onclick = deleteSelected;

document.getElementById('btnClear').onclick = () => {
  if (!canvas.getObjects().length) return;
  if (!confirm('确定要清空画布吗？')) return;
  canvas.clear();
  canvas.backgroundColor = '#ffffff';
  canvas.requestRenderAll();
  refreshLayers();
  updateHint();
};

window.addEventListener('keydown', (e) => {
  const tag = (document.activeElement || {}).tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (canvas.getActiveObjects().length) {
      e.preventDefault();
      deleteSelected();
    }
  }
});

/* =====================================================
   10. 保存分析图（裁剪到内容范围）
   ===================================================== */
document.getElementById('btnExport').onclick = () => {
  const objs = canvas.getObjects();
  if (!objs.length) {
    alert('画布为空，请先上传户型图或添加图层');
    return;
  }

  canvas.discardActiveObject();
  canvas.requestRenderAll();

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  objs.forEach((o) => {
    const r = o.getBoundingRect(true, true);
    minX = Math.min(minX, r.left);
    minY = Math.min(minY, r.top);
    maxX = Math.max(maxX, r.left + r.width);
    maxY = Math.max(maxY, r.top + r.height);
  });

  const pad = 24;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;

  const w = Math.ceil(maxX - minX);
  const h = Math.ceil(maxY - minY);
  if (w <= 0 || h <= 0) {
    alert('内容尺寸异常，无法导出');
    return;
  }

  const dataURL = canvas.toDataURL({
    format: 'png',
    quality: 1,
    multiplier: 2,
    left: minX,
    top: minY,
    width: w,
    height: h,
  });

  const a = document.createElement('a');
  a.href = dataURL;
  a.download = `户型分析_${Date.now()}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
};

/* =====================================================
   11. 启动
   ===================================================== */
refreshLayers();
updateHint();
</script>
</body>
</html>
